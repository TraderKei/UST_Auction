function eventTable(rs){return table(['일자','종목명','만기','유형','상태','예정금액','응찰금액','낙찰/행사금액','응찰배수(x)','최저(%)','최고(%)','가중평균/발행금리(%)','테일(bp)','납입일','날짜 기준','원본 행'],rs.map(r=>[r.date,r.name,r.mat,r.kind,r.state,fmt(r.amount),fmt(r.bid),fmt(r.won),fmt(r.btc,3),fmt(r.low,3),fmt(r.high,3),fmt(r.avg,3),fmt(r.tail,2),r.payment,r.dateBasis,r.id]),rs.map(r=>r.id),true);}
function calendar(rs){const [year,month]=state.calendar.split('-').map(Number);const start=new Date(year,month-1,1).getDay(),days=new Date(year,month,0).getDate();let h='<div class="calendar">'+['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')+'<div class="day"></div>'.repeat(start);for(let d=1;d<=days;d++){const day=state.calendar+'-'+String(d).padStart(2,'0');h+=`<div class="day"><span>${d}</span>${rs.filter(r=>r.date===day).map(r=>`<button class="event ${r.state==='결과'?'':'plan'}" data-event="${r.id}" title="${esc(r.name+' / '+r.state+' / '+r.dateBasis)}">${esc(r.kind)} ${esc(r.mat)}<br>${esc(r.state)} ${fmt(r.state==='결과'?r.won:r.amount)}</button>`).join('')}</div>`;}return `<div class="body"><label>표시월 <select id="calMonth">${months.map(m=>`<option ${m===state.calendar?'selected':''}>${m}</option>`).join('')}</select></label></div>${h}</div>`;}
function planGroups(ps){return [...group(ps,p=>p.date.slice(0,7)+'|'+p.mat)].map(([key,rs])=>{const ambiguous=[...group(rs,r=>r.date+'|'+r.amount)].some(([,a])=>a.length>1);return {month:key.split('|')[0],mat:rs[0].mat,amount:ambiguous?null:sum(rs,'amount'),ambiguous,refs:rs.map(r=>r.id).join(', ')};});}
function auction(){const rs=filtered(events),cs=filtered(comp);const pg=planGroups(filtered(plans).filter(p=>p.kind==='경쟁'));const chosen=comp.find(r=>r.id===state.selected);return kpis([['조회 결과 건수',fmt(rs.filter(r=>r.state==='결과').length),'공고·계획 별도 표시'],['경쟁 낙찰금액',fmt(sum(cs,'won')),'원문 금액 단위'],['경쟁 응찰배수',fmt(ratio(sum(cs,'bid'),sum(cs,'amount')),3)+' x','응찰합계 ÷ 예정합계'],['경쟁 평균 테일',fmt(mean(cs.map(r=>r.tail)),2)+' bp','입찰별 단순평균'],['경쟁 계획금액',fmt(sum(pg,'amount')),pg.some(p=>p.ambiguous)?'종목 간 금액 중복 범위 확인 필요':'국고·물가 / 조회기간']])+note('결과·공고·계획은 서로 다른 상태입니다. 결과가 없는 과거 공고도 예정으로 단정하지 않습니다. 매입·교환 결과의 날짜는 INPUT_DATE입니다. 금액은 원문 단위이며 모든 테이블의 단위가 명시된 것은 아닙니다.')+`<div class="grid">${panel('입찰 캘린더',calendar(rs),'주황: 공고·계획')}${panel('입찰 블로터',eventTable(rs),'행 클릭 → 상세·원본')}</div>`+(chosen?panel('선택 경쟁입찰 추이',trend(chosen),chosen.name):'');}
function trend(r){const history=filtered(comp).filter(c=>c.mat===r.mat).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="two">${lineChart(history.map(c=>({label:c.date,v:c.btc})),'응찰배수 x')}${lineChart(history.map(c=>({label:c.date,v:c.tail})),'테일 bp')}</div>`;}
function results(){const rs=filtered(comp);return kpis([['경쟁입찰',fmt(rs.length),'필터 적용'],['예정금액',fmt(sum(rs,'amount')),'원문 금액'],['응찰금액',fmt(sum(rs,'bid')),'원문 금액'],['낙찰금액',fmt(sum(rs,'won')),'원문 금액'],['낙찰률',fmt(ratio(sum(rs,'won'),sum(rs,'bid'))===null?null:ratio(sum(rs,'won'),sum(rs,'bid'))*100,2)+' %','낙찰합계 ÷ 응찰합계 × 100']])+panel('경쟁입찰 결과 상세',eventTable(rs),'원본 sheet 1 · 행을 선택하세요')+note('민평대비 스프레드는 민평금리가 없어 산출하지 않습니다. 테일=(최고낙찰금리−가중평균낙찰금리)×100. 원본 값이 동일하면 테일 0bp는 실제 계산값입니다.');}
function periodMonths(){const a=state.from.split('-').map(Number),b=state.to.split('-').map(Number),result=[];for(let i=a[0]*12+a[1]-1;i<=b[0]*12+b[1]-1&&result.length<240;i++)result.push(`${Math.floor(i/12)}-${String(i%12+1).padStart(2,'0')}`);return result;}
function demand(){const rs=filtered(comp),ms=periodMonths(),mats=uniq(rs.map(r=>r.mat)).sort((a,b)=>parseInt(a)-parseInt(b));const values=mats.map(mat=>ms.map(m=>{const a=rs.filter(r=>r.mat===mat&&r.date.startsWith(m));return state.metric==='btc'?ratio(sum(a,'bid'),sum(a,'amount')):mean(a.map(r=>r.tail));}));const max=Math.max(1,...values.flat().filter(v=>v!==null).map(Math.abs));exported={headers:['만기',...ms],rows:mats.map((m,i)=>[m,...values[i]])};return note('종합 수요점수와 민평대비 지표는 산식·민평금리가 없어 제공하지 않습니다. 응찰배수는 합계비율, 테일은 입찰별 단순평균입니다. 색은 값의 상대 크기이며 강/약 등급이 아닙니다.')+panel('만기별 월간 수요 지표',`<div class="body"><label>지표 <select id="metric"><option value="btc" ${state.metric==='btc'?'selected':''}>응찰배수 (x)</option><option value="tail" ${state.metric==='tail'?'selected':''}>평균 테일 (bp)</option></select></label></div><div class="scroll"><table><thead><tr><th>만기</th>${ms.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${mats.map((m,i)=>`<tr><td>${esc(m)}</td>${values[i].map(v=>`<td class="heat num" style="--intensity:${v===null?0:Math.abs(v)/max*65}">${fmt(v,2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)+panel('월별 추이',lineChart(ms.map(m=>{const a=rs.filter(r=>r.date.startsWith(m));return {label:m,v:state.metric==='btc'?ratio(sum(a,'bid'),sum(a,'amount')):mean(a.map(r=>r.tail))};}),state.metric==='btc'?'응찰배수 x':'테일 bp'));}
function issuance(){const ps=filtered(plans).filter(r=>r.kind==='경쟁'),gs=planGroups(ps);const full=planGroups(plans.filter(r=>r.kind==='경쟁'&&(state.mat==='전체'||r.mat===state.mat)&&r.name.toLowerCase().includes(state.search.toLowerCase())));const ms=periodMonths(),totals=ms.map(m=>sum(gs.filter(g=>g.month===m),'amount'));const detail=gs.sort((a,b)=>a.month.localeCompare(b.month)).map(g=>{const [y,m]=g.month.split('-').map(Number);const prev=`${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,'0')}`;const p=full.find(x=>x.month===prev&&x.mat===g.mat);return [g.month,g.mat,fmt(g.amount),fmt(p?.amount),fmt(g.amount!==null&&number(p?.amount)!==null?g.amount-p.amount:null),g.ambiguous?'동일 일자·만기·금액 반복: 합계 보류':'원문 행 합계',g.refs];});return note('국고채·물가채 계획만 집계하며 외평채·교환은 제외합니다. 동일 날짜·만기·금액의 다종목 배정은 공동 한도 여부가 불명확하여 해당 만기와 월 합계를 보류합니다. 전월 값은 같은 검색·만기 조건이며 조회기간 밖의 직전월도 비교합니다. 연간목표·완전한 전년자료가 없어 연간 및 전년비는 산출하지 않습니다.')+panel('월간 발행계획',bars(ms,totals),'sheet 3 / 원문 금액')+panel('만기별 계획 증감',table(['월','만기','계획금액','전월 계획','증감','검토 상태','원본 행'],detail,[],true))+panel('계획 원문 내역',table(['입찰일','종목','구분','예정액','납입일','원본 행'],filtered(plans).map(p=>[p.date,p.name,p.mat,p.amount,p.payment,p.id]),filtered(plans).map(p=>p.id)));}
function supply(){const ms=periodMonths();const data=ms.map(m=>{const c=filtered(comp).filter(r=>r.date.startsWith(m)),n=filtered(non).filter(r=>r.date.startsWith(m)),b=filtered(other).filter(r=>r.kind==='매입'&&r.date.startsWith(m)),x=filtered(other).filter(r=>r.kind==='교환'&&r.date.startsWith(m)),s=filtered(sub).filter(r=>r.date.startsWith(m));return [m,fmt(sum(c,'won')),fmt(sum(n,'won')),fmt(sum(s,'won')),fmt(sum(b,'won')),fmt(sum(x,'won')),'—','산출 불가'];});return kpis([['순공급','산출 불가','만기상환 원금·교환 양방향 실적 없음'],['만기상환','미제공','공고의 상환일만으로 금액 추정 불가'],['경쟁 낙찰',fmt(sum(filtered(comp),'won')),'입찰일 기준'],['비경쟁 행사',fmt(sum(filtered(non),'won')),'행사 종료일 기준'],['매입 낙찰',fmt(sum(filtered(other).filter(r=>r.kind==='매입'),'won')),'입력일 기준']])+note('아래는 원천별 실적 참고표이며 결제일 기준 총발행·순공급이 아닙니다. 매입·교환은 종목별 ALLOCATION_AMOUNT만 합산하여 반복된 TOTAL_ALLOCATION_AMOUNT를 중복 합산하지 않습니다. 데이터가 없는 월은 0이 아닌 —로 표시합니다.')+panel('월별 공급 관련 관측 실적',table(['월','경쟁 낙찰','비경쟁 행사','모집 낙찰','매입 낙찰','교환 배정','만기상환','순공급'],data,[],true),'원문 금액 / 기준일 혼재');}
function noncompetitive(){const rs=filtered(non),ss=filtered(sub);const types=[...group(rs,r=>r.raw.ACQUISITION_NAME)].map(([t,a])=>({type:t,amount:sum(a,'won'),count:a.length}));return kpis([['비경쟁 행사금액',fmt(sum(rs,'won')),'sheet 2 / 행사 종료일 기준'],['비경쟁 행사 건수',fmt(rs.length),'원본 인수명별 구분'],['모집 낙찰금액',fmt(sum(ss,'won')),'sheet 8 / 별도 실적'],['비경쟁Ⅰ·Ⅳ','미제공','Ⅱ·Ⅲ에서 추정하지 않음'],['총발행 대비 비중','산출 보류','기간·대상·중복 범위 확인 필요']])+panel('인수유형별 행사금액',bars(types.map(t=>t.type),types.map(t=>t.amount)))+panel('비경쟁 인수 내역',table(['행사 종료일','종목','만기','인수명','행사금액','참여기관수','인수율(%)','행사 시작일','원본 행'],rs.map(r=>[r.date,r.name,r.mat,r.raw.ACQUISITION_NAME,r.won,r.raw.ACQUIRE_INVEST_NUM,r.rate,date(r.raw.EXECUTION_FROM_DATE),r.id]),rs.map(r=>r.id),true))+panel('모집방식 비경쟁인수',table(['입찰일','종목','만기','그룹','응찰금액','낙찰금액','원본 행'],ss.map(r=>[r.date,r.name,r.mat,r.raw.GROUP_TYPE,r.bid,r.won,r.id]),ss.map(r=>r.id)))+note('인수율은 원문 ACQUISITION_RATE를 표시합니다. 참여기관수는 행사별 수이며 합산하여 고유 기관 수로 해석하지 않습니다. 모집 결과는 sheet 2와의 중복 여부가 확인되지 않아 합산 비중을 만들지 않습니다.');}
const screens=[['auc','입찰 캘린더·블로터',auction],['res','입찰결과 상세',results],['dmd','수요강도 트래커',demand],['plan','발행계획 증감분석',issuance],['sd','수급(순공급) 분석',supply],['pd','비경쟁 인수 분석',noncompetitive]];
function render(){exported={headers:[],rows:[]};$('tabs').innerHTML=screens.map(([key,label])=>`<button data-tab="${key}" class="${state.tab===key?'on':''}" aria-pressed="${state.tab===key}">${label}</button>`).join('');$('status').textContent=`조회 ${state.from} ~ ${state.to} / 만기 ${state.mat} / 유형 ${state.kind} / 금액: 원문 단위 · —: 자료 없음 또는 산출 불가`;$('content').innerHTML=screens.find(s=>s[0]===state.tab)[2]();}
function detail(id){const r=events.find(e=>e.id===id)||plans.find(e=>e.id===id);if(!r)return;state.selected=id;const specs=DB.specs.filter(s=>s.table===DB.tables[r.s].name);$('detailBody').innerHTML=`<h3>${esc(r.name)} · ${esc(r.date)} <span class="badge">${esc(r.state)}</span></h3>`+kpis([['예정금액',fmt(r.amount),'원문'],['낙찰/행사금액',fmt(r.won),'원문'],['응찰배수',fmt(r.btc,3),'응찰 ÷ 예정'],['테일',fmt(r.tail,2)+' bp','최고−가중평균'],['민평대비','미제공','민평금리 없음']])+(r.s===1?panel('낙찰금리 구조',bars(['최저 (%)','가중평균 (%)','최고 (%)'],[r.low,r.avg,r.high]))+trend(r):'')+note(`원본: DB_TABLE.xlsx / ${r.id} / ${DB.tables[r.s].name}. 날짜 기준: ${r.dateBasis}.`)+(r.notices?.length?`<p>정확히 연결된 공고 행: ${esc(r.notices.join(', '))}</p>`:'')+table(['컬럼','설명','원본 값'],specs.map(s=>[s.column,s.description,r.raw[s.column]]));render();$('detail').showModal();}
function source(){const s=$('sourceTable').value,t=DB.tables[s],q=$('sourceSearch').value.toLowerCase();const rs=t.rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));const specs=DB.specs.filter(c=>c.table===t.name);$('sourceInfo').innerHTML=`<b>${esc(t.name)}</b><p>${esc(t.description)} · 전체 ${t.rows.length}행 / 검색 ${rs.length}행</p><details><summary>컬럼 스펙 보기</summary>${table(['컬럼','설명','유형','길이','Not Null'],specs.map(c=>[c.column,c.description,c.type,c.length,String(c.required)]))}</details>`;$('raw').innerHTML=table(['Excel 행',...t.headers],rs.map(r=>[r._row,...t.headers.map(h=>r[h])]));}
function sync(){for(const [id,key] of [['from','from'],['to','to'],['maturity','mat'],['kind','kind'],['search','search']])$(id).value=state[key];}
$('asof').textContent=`원본 최신 입력일 ${asof}`;$('hash').textContent=`SHA-256: ${DB.sha256}`;
for(const id of ['from','to']){$(id).min=months[0];$(id).max=months.at(-1);}
$('maturity').innerHTML=['전체',...uniq(events.map(r=>r.mat)).sort((a,b)=>(parseInt(a)||999)-(parseInt(b)||999))].map(m=>`<option>${esc(m)}</option>`).join('');
$('kind').innerHTML=['전체',...uniq(events.map(r=>r.kind))].map(m=>`<option>${esc(m)}</option>`).join('');
for(const [id,key] of [['from','from'],['to','to'],['maturity','mat'],['kind','kind'],['search','search']])$(id).addEventListener(id==='search'?'input':'change',e=>{if(!e.target.value&&id!=='search'){sync();return;}state[key]=e.target.value;if(state.from>state.to){if(key==='from')state.to=state.from;else state.from=state.to;}state.calendar=state.to;sync();render();});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;render();}});
$('content').addEventListener('click',e=>{const row=e.target.closest('[data-event]');if(row)detail(row.dataset.event);});
$('content').addEventListener('keydown',e=>{if(e.target.matches('tr[data-event]')&&['Enter',' '].includes(e.key)){e.preventDefault();detail(e.target.dataset.event);}});
$('content').addEventListener('change',e=>{if(e.target.id==='calMonth'){state.calendar=e.target.value;render();}if(e.target.id==='metric'){state.metric=e.target.value;render();}});
$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'다크 테마':'화이트 테마';};
$('reset').onclick=()=>{state={...state,from:months.at(-1),to:months.at(-1),mat:'전체',kind:'전체',search:'',calendar:months.at(-1)};sync();render();};
$('closeDetail').onclick=()=>$('detail').close();
$('export').onclick=()=>{const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+[exported.headers,...exported.rows].map(r=>r.map(safe).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`KTB_${state.tab}_${state.from}_${state.to}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('sourceTable').innerHTML=Object.entries(DB.tables).map(([s,t])=>`<option value="${s}">${s} · ${esc(t.description)}</option>`).join('');$('sourceTable').onchange=source;$('sourceSearch').oninput=source;
sync();render();source();
</script></body></html>
